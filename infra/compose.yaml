services:
  database:
    image: postgres:16-alpine
    container_name: spendsmart-database
    restart: unless-stopped
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST:-localhost}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER:-local_user}
      POSTGRES_DB: ${POSTGRES_DB:-local_db}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - spendsmart-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-local_user} -d ${POSTGRES_DB:-local_db}"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  spendsmart-postgres-data:
