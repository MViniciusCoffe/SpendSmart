name: Deploy de produção

# Issue #48: migration antes do deploy, com aprovação humana. O deploy automático da Vercel para a
# main está desligado (vercel.json), então este workflow é o único caminho para a produção.
# Configuração (environment, secrets, aprovadores): docs/environments.md §10.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Um deploy de produção por vez; o seguinte espera em vez de cancelar o que está rodando
concurrency:
  group: production
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v5

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Testes unitários, de integração (pg-mem) e de regressão
        run: |
          npm test
          npm run test:integration
          npm run test:regression

  production:
    needs: verify
    runs-on: ubuntu-latest
    # O environment "production" exige aprovação: é a decisão humana do `--apply` (AGENTS.md §10.3)
    environment:
      name: production
      url: https://spend-smart-lilac.vercel.app

    steps:
      - name: Baixar código
        uses: actions/checkout@v5

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Configurar Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.121.0

      # O dry-run lista no log o que vai ser aplicado, antes de aplicar
      - name: Migrations pendentes (dry-run)
        run: supabase db push --db-url "$DATABASE_URL" --dry-run
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_PROD_DB_URL }}

      - name: Aplicar migrations
        run: supabase db push --db-url "$DATABASE_URL" --yes
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_PROD_DB_URL }}

      # Build na própria Vercel, com as variáveis do painel (inclusive as Sensitive, que o
      # `vercel pull` não lê). Só roda se as migrations passaram. O APP_COMMIT_SHA vale só para este
      # deploy e volta no /health: é por ele que o smoke-test sabe que validou a versão nova.
      - name: Deploy na Vercel
        run: >-
          npx --yes vercel@65.2.0 deploy --prod --yes --token "$VERCEL_TOKEN"
          --env APP_COMMIT_SHA="$GITHUB_SHA"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  # Shift-right: confere a produção depois do deploy. Só passa com 200 no /health (banco e Auth no ar)
  # e com o commit que este pipeline publicou; commit diferente quer dizer que o domínio ainda está na
  # versão antiga (ex.: depois de um Instant Rollback). Falha deixa o pipeline vermelho, sem rollback
  # automático: as migrations já rodaram, e a volta é decisão humana (docs/environments.md).
  # Motivos: docs/tooling-decisions.md §31.
  smoke-test:
    needs: production
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Smoke test no /health (200 e commit publicado)
        env:
          HEALTH_URL: https://spend-smart-lilac.vercel.app/health
          EXPECTED_COMMIT: ${{ github.sha }}
          ATTEMPTS: 6
          DELAY_SECONDS: 10
        run: |
          # Sem o jq, o commit sairia sempre "ausente" e a falha pareceria versão antiga
          command -v jq >/dev/null || { echo "::error::jq não encontrado no runner."; exit 1; }

          for attempt in $(seq 1 "$ATTEMPTS"); do
            rm -f health.json
            code=$(curl -sS --max-time 10 -o health.json -w "%{http_code}" "$HEALTH_URL") || code=000
            # Corpo que não é JSON (página de erro da Vercel, por exemplo) vira commit ausente
            commit=$(jq -r '.commit // empty' health.json 2>/dev/null || true)
            echo "Tentativa $attempt/$ATTEMPTS: HTTP $code, commit ${commit:-ausente}"
            cat health.json 2>/dev/null && echo

            if [ "$code" = "200" ] && [ "$commit" = "$EXPECTED_COMMIT" ]; then
              echo "Produção saudável e na versão publicada ($EXPECTED_COMMIT)."
              exit 0
            fi
            [ "$attempt" -lt "$ATTEMPTS" ] && sleep "$DELAY_SECONDS"
          done

          echo "::error::Smoke test falhou: esperado HTTP 200 e commit $EXPECTED_COMMIT em $HEALTH_URL (última resposta: HTTP $code, commit ${commit:-ausente})."
          exit 1
