name: linting

on:
  # Push só na main: nas outras branches o PR já dispara o mesmo workflow. Sem o filtro, cada PR
  # rodava tudo duas vezes (push + pull_request), dobrando o uso e a chance de falha intermitente
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v5

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Verificar lint
        run: npm run lint:eslint:check

      - name: Verificar formatação
        run: npm run lint:prettier:check

      - name: Verificar regras do AGENTS.md
        run: npm run check:agents
