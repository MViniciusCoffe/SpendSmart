name: linting

on:
  # Só em PR e chamado pelo deploy.yml (workflow_call), que o roda antes da produção. Sem push na
  # main: o deploy.yml já roda este workflow no commit da main, e o push dobraria a execução (e a
  # chance de falha intermitente). Nas outras branches o PR já dispara o mesmo workflow.
  pull_request:
  workflow_call:

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v5

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Verificar lint
        run: npm run lint:eslint:check

      - name: Verificar formatação
        run: npm run lint:prettier:check

      - name: Verificar regras do AGENTS.md
        run: npm run check:agents
