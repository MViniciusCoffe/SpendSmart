name: CodeQL

# Análise de segurança do código (issue #50): injeção, XSS, path traversal, uso inseguro de dados
# da requisição. Os alertas aparecem em Security → Code scanning.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Segunda, 06:00 UTC: pega consultas novas do CodeQL mesmo sem commit
    - cron: "0 6 * * 1"

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Baixar código
        uses: actions/checkout@v5

      # JavaScript não precisa de build: o CodeQL lê o fonte direto
      - name: Inicializar CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended

      - name: Analisar
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript"
