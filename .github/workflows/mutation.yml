name: Testes de Mutação

on:
  pull_request:
    paths:
      - "src/services/**"
      - "tests/unit/**"
      - "tests/helpers/**"
      - "stryker.conf.json"
      - "jest.stryker.config.js"
      - ".github/workflows/mutation.yml"
  workflow_dispatch:

jobs:
  mutation:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v5

      - name: Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Executar testes de mutação (Stryker)
        run: npm run test:mutation

      - name: Publicar relatório de mutação
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-mutacao
          path: reports/mutation/
          if-no-files-found: ignore
