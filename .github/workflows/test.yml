name: Testes

on:
  # Push só na main: nas outras branches o PR já dispara o mesmo workflow. Sem o filtro, cada PR
  # rodava tudo duas vezes (push + pull_request), dobrando o uso e a chance de falha intermitente
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v5

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Executar testes unitários + cobertura
        run: npm run test:coverage

      - name: Executar testes de integração (pg-mem)
        run: npm run test:integration

      # Não precisam de .env.local nem de Supabase: mockam o cliente ou carregam as rotas sem chave
      - name: Executar testes de regressão
        run: npm run test:regression

  audit:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v5

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      # Falha só com vulnerabilidade high ou critical (issue #51). Hoje há moderadas, todas em
      # ferramentas de desenvolvimento (Jest/cobertura), cuja correção exige atualização major.
      - name: Auditar dependências
        run: npm audit --audit-level=high

  rls:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v5

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Configurar Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.121.0

      # As portas do Supabase local (54321, 54322...) caem na faixa efêmera do Linux (32768-60999).
      # Uma conexão de saída (os pulls das imagens, por exemplo) às vezes pega a 54322 como porta de
      # origem, e o `supabase start` falha com "address already in use" de forma intermitente.
      # Afastar a faixa efêmera libera as portas do Supabase.
      - name: Reservar as portas do Supabase
        run: sudo sysctl -w net.ipv4.ip_local_port_range="60000 65000"

      # Só Postgres, Auth e o gateway: é o que os testes de RLS usam
      - name: Subir Supabase local
        run: supabase start -x studio,imgproxy,vector,logflare,realtime,storage-api,edge-runtime,supavisor,postgres-meta,mailpit

      - name: Exportar chaves do Supabase local
        run: |
          supabase status -o env \
            --override-name api.url=NEXT_PUBLIC_SUPABASE_URL \
            --override-name auth.anon_key=NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY \
            --override-name auth.service_role_key=SUPABASE_SERVICE_ROLE_KEY \
            | grep -E '^(NEXT_PUBLIC_SUPABASE_URL|NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY|SUPABASE_SERVICE_ROLE_KEY)=' \
            | sed 's/"//g' >> "$GITHUB_ENV"

      - name: Executar testes de RLS (Supabase real)
        run: npm run test:integration:supabase
